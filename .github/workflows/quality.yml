name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # verify-numbers.py compares commit times of results against engine code.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the same checks as locally
        # ci-check.sh is the single source of truth for what CI runs, so local and CI
        # can never drift (PLAN.md §9, gotcha 2). myst is absent here and the script skips it;
        # the deploy workflow is what proves the book builds.
        run: ./scripts/ci-check.sh

name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No fetch-depth needed. An earlier verify-numbers.py compared commit *times*, which
        # required full history; it now hashes file contents, which requires only the checkout.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MyST CLI (pinned)
        # Required, not optional: without it ci-check.sh cannot run `myst build --strict`, and a
        # broken cross-reference would reach main unnoticed. ci-check.sh fails when CI is set
        # and myst is missing, so this step going wrong cannot pass silently.
        run: npm install -g "mystmd@$(node -p "require('./package.json').devDependencies.mystmd")"

      - name: Install dependencies
        # Both files. requirements-dev.txt alone was enough while the tests only exercised pure
        # Python, but the engine is real now and the test suite imports torch. Installing only the
        # dev tooling made CI unable to run a single test while still reporting success on lint —
        # the tests errored at collection, which is a failure, but a silent-looking one.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the same checks as locally
        # ci-check.sh is the single source of truth for what CI runs, so local and CI can never
        # drift (PLAN.md §9, gotcha 2).
        run: ./scripts/ci-check.sh

      - name: Assemble the PDF's HTML
        # The mdast renderer is the one part of the book's pipeline that is not MyST's, and it was
        # previously only ever run by the deploy workflow — on main, after review. A defect in it
        # therefore reached main unverified, and one did: every explicit --out crashed the run at
        # the line reporting success, including the relative path deploy.yml itself passes.
        #
        # This runs the renderer over every real page on every push. Deliberately no Chromium: the
        # install is a minute and the print step is the least of it — assembling the HTML is what
        # touches every page in the book and every node type in them.
        run: python3 scripts/build-pdf.py --no-myst --html-only --out _build/pdf-check/book.pdf
